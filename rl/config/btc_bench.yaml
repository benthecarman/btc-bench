# btc-bench GRPO with LoRA on FSDP and vLLM rollouts.
#
# Algorithm follows the XiaomiMiMo/verl RL arms: GRPO, no KL, no entropy
# bonus, symmetric 0.2 clip, prompt-mean loss with one optimizer step per
# rollout batch, zero-variance groups dropped. Launch with rl/run_train.sh,
# which fills in paths and sizes.

hydra:
  searchpath:
    - pkg://verl.trainer.config

defaults:
  - ppo_trainer
  - _self_

actor_rollout_ref:
  hybrid_engine: true
  model:
    path: ???
    enable_gradient_checkpointing: true
    use_remove_padding: true
    lora_rank: 32
    lora_alpha: 32
    # Qwen3.5-family layers are 3:1 Gated DeltaNet to full attention;
    # q/k/v/o exist only in the full-attention quarter, so the GDN
    # projections must be named or 48 of 64 layers get MLP adapters only.
    target_modules:
      - in_proj_qkv
      - in_proj_z
      - out_proj
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj
    # The vision tower and MTP head stay frozen and adapter-free.
    exclude_modules: ".*(visual|mtp).*"

  rollout:
    name: vllm
    mode: async
    n: 8
    temperature: 1.0
    top_p: 0.95
    top_k: 20
    load_format: safetensors
    layered_summon: true
    multi_turn:
      enable: false
      format: qwen3_coder
    agent:
      agent_loop_config_path: ???
    val_kwargs:
      do_sample: true
      n: 1
      temperature: 1.0
      top_p: 0.95
      top_k: 20

  actor:
    strategy: fsdp2
    fsdp_config:
      # The frozen base needs no fp32 master copy; PEFT upcasts the
      # trainable adapter weights to fp32 on a bf16 base.
      model_dtype: bf16
    use_dynamic_bsz: true
    loss_agg_mode: prompt-mean
    clip_ratio: 0.2
    clip_ratio_low: 0.2
    clip_ratio_high: 0.2
    entropy_coeff: 0
    use_kl_loss: false
    optim:
      lr: 1e-4

data:
  train_files: ???
  val_files: ???
  prompt_key: prompt
  return_raw_chat: true
  filter_overlong_prompts: false
  # models.toml sends the same flag to the eval server.
  apply_chat_template_kwargs:
    enable_thinking: true

algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: false
  use_kl_in_reward: false
  filter_groups:
    enable: true
    metric: reward
  # Reward-server outages score this; GRPO drops them from the group.
  invalid_reward_value: -999.0

trainer:
  logger:
    - console
    - tensorboard
  val_before_train: true
  log_val_generations: 4
  resume_mode: auto
  v1:
    trainer_mode: sync
