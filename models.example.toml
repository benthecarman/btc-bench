# btc-bench model configuration. Copy to models.toml and fill in keys.
# One [[model.<name>]] table per model; keys are read from the
# environment variable named by `api_key_env` at run time.
#
#   btc-bench run --dataset datasets/v1 --config models.toml --model gpt-5

# OpenAI (Responses API).
[model.gpt-5]
provider = "openai"
model = "gpt-5"
api_key_env = "OPENAI_API_KEY"

# Any OpenAI-compatible endpoint (OpenRouter, vLLM, Ollama, Together, ...).
[model.local]
provider = "openai_compatible"
model = "qwen3-coder"
base_url = "http://127.0.0.1:8000/v1"
# api_key_env omitted when the endpoint needs no auth
# stream = false  # opt out of SSE (default true) for endpoints
#                 # that only serve plain JSON completions

# Anthropic (Messages API; always streams, tool calls arrive complete).
[model.claude]
provider = "anthropic"
model = "claude-opus-5-5"
api_key_env = "ANTHROPIC_API_KEY"
# Required for anthropic: the model's maximum output. Left unset, the
# client library would cap every answer at 4,096 tokens.
max_tokens = 128000
# Claude Opus 5.5 rejects sampling parameters; send none.
omit_temperature = true
# Adaptive-thinking effort (low, medium, high, xhigh, max). The client
# library sends high when unset, while the API's own default is medium,
# so set it explicitly.
request_params = { thinking_effort = "medium" }

# Optional per-model sampling override; default shown.
# temperature = 0.0
